<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ideal Rolling Spirograph 5.8</title>
<style>
  :root{--panel:#0f1012;--stroke:#2a2d34;--text:#f2f2f2}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#000;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
  body{padding:10px}
  .app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 610px;gap:10px;align-items:start}
  .stage-shell,.control-panel{background:linear-gradient(180deg,#050505,#0a0a0a);border:1px solid #20242c;border-radius:24px;overflow:hidden}
  .stage-shell{aspect-ratio:1/1;width:100%;max-width:calc(100vh - 20px);max-height:calc(100vh - 20px);padding:10px;align-self:start;justify-self:start}
  .canvas-wrap{display:flex;align-items:center;justify-content:center;width:100%;height:100%;aspect-ratio:1/1}
  canvas{display:block;width:100%;height:auto;aspect-ratio:1/1;max-width:100%;max-height:100%}

  .control-panel{display:flex;flex-direction:column;align-self:start;min-height:0;overflow:hidden;padding:14px}
  .control-scroll{min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:14px}
  .group{background:var(--panel);border:1px solid var(--stroke);border-radius:18px;padding:14px}
  .group h3{margin:0 0 10px;font-size:17px}

  .layer-selector{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .layer-select-btn,.all-select-btn,.big-toggle,.size-btn,.change-btn,.draw-btn{appearance:none;background:#16191e;color:#fff;border:1px solid #38404c;cursor:pointer}
  .layer-select-btn{border-radius:14px;min-height:70px;padding:10px;font-size:15px;font-weight:750;display:flex;align-items:center;justify-content:center;gap:8px}
  .layer-select-btn.active,.all-select-btn.active{background:#fff;color:#000;border-color:#fff}
  .layer-dot{width:13px;height:13px;border-radius:50%;border:1px solid rgba(255,255,255,.5);flex:0 0 auto}
  .all-select-btn{border-radius:14px;width:100%;margin-top:10px;min-height:52px;font-size:16px;font-weight:850}

  .palette-inline{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;margin-top:6px}
  .swatch-button{width:100%;aspect-ratio:1/1;border-radius:11px;border:2px solid rgba(255,255,255,.18);background:#222;cursor:pointer;padding:0}
  .swatch-button.selected{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.24) inset}

  .edit-grid{display:grid;grid-template-columns:1fr 1.5fr;gap:12px;align-items:stretch}
  .big-toggle{border-radius:15px;min-height:74px;font-size:17px;font-weight:850;padding:10px;transition:border-color .16s,box-shadow .16s}
  .big-toggle.on{border:2px solid #fff;box-shadow:0 0 0 1px rgba(255,255,255,.12) inset}
  .size-control{display:grid;grid-template-columns:70px 1fr 70px;gap:9px;align-items:stretch}
  .size-btn{border-radius:15px;min-height:74px;font-size:38px;font-weight:400;line-height:1}
  .size-readout{display:flex;align-items:center;justify-content:center;text-align:center;font-size:17px;font-weight:850;border:1px solid #2f3440;border-radius:15px;background:#121419;padding:8px;line-height:1.15}

  .change-btn,.draw-btn{border-radius:16px;width:100%;min-height:66px;font-size:21px;font-weight:900;margin-top:2px;transition:border-color .14s,box-shadow .14s,opacity .14s}
  .draw-btn:disabled{opacity:.48;cursor:default}
  .change-btn.flash{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.55),0 0 16px rgba(255,255,255,.22)}
  .change-btn:active,.draw-btn:active:not(:disabled),.layer-select-btn:active,.all-select-btn:active,.big-toggle:active,.size-btn:active,.swatch-button:active{transform:translateY(1px)}

  @media (max-width:1200px){
    body{padding:0;overflow:auto}
    .app{height:auto;min-height:100vh;grid-template-columns:1fr}
    .stage-shell{width:100%;max-width:none;max-height:none;min-height:55vh}
    .control-panel{height:auto!important;max-height:none!important}
  }
</style>
</head>
<body>
<div class="app">
  <section class="stage-shell" id="stageShell">
    <div class="canvas-wrap"><canvas id="canvas" width="1024" height="1024"></canvas></div>
  </section>

  <aside class="control-panel" id="controlPanel">
    <div class="control-scroll">
      <div class="group">
        <div class="layer-selector">
          <button type="button" class="layer-select-btn active" data-layer="0"><span class="layer-dot" id="layerDot0"></span>Outer</button>
          <button type="button" class="layer-select-btn" data-layer="1"><span class="layer-dot" id="layerDot1"></span>Layer 2</button>
          <button type="button" class="layer-select-btn" data-layer="2"><span class="layer-dot" id="layerDot2"></span>Layer 3</button>
          <button type="button" class="layer-select-btn" data-layer="3"><span class="layer-dot" id="layerDot3"></span>Layer 4</button>
        </div>
        <button type="button" class="all-select-btn" id="allBtn">All Layers</button>
      </div>

      <div class="group">
        <h3 id="paletteHeading">Color Outer Layer</h3>
        <div class="palette-inline" id="sharedPalette"></div>
      </div>

      <div class="group">
        <div class="edit-grid">
          <button type="button" class="big-toggle on" id="visibilityBtn">Outer Layer On</button>
          <div class="size-control">
            <button type="button" class="size-btn" id="sizeMinus">−</button>
            <div class="size-readout" id="sizeReadout">Size Outer Layer</div>
            <button type="button" class="size-btn" id="sizePlus">+</button>
          </div>
        </div>
      </div>

      <button class="change-btn" id="randomBtn">Change Outer Layer</button>
      <button class="draw-btn" id="drawBtn">Draw</button>
    </div>
  </aside>
</div>

<script>
(() => {
  const LAYER_COUNT=4;
  const canvas=document.getElementById('canvas');
  const ctx=canvas.getContext('2d');
  const paletteHeading=document.getElementById('paletteHeading');
  const allBtn=document.getElementById('allBtn');
  const visibilityBtn=document.getElementById('visibilityBtn');
  const sizeMinus=document.getElementById('sizeMinus');
  const sizePlus=document.getElementById('sizePlus');
  const sizeReadout=document.getElementById('sizeReadout');
  const randomBtn=document.getElementById('randomBtn');
  const drawBtn=document.getElementById('drawBtn');
  const stageShell=document.getElementById('stageShell');
  const controlPanel=document.getElementById('controlPanel');

  const crayon16=[
    {name:'Red',hex:'#ED0A3F'},{name:'Red-Orange',hex:'#FF5349'},{name:'Orange',hex:'#FF8833'},{name:'Yellow-Orange',hex:'#FFAE42'},
    {name:'Yellow',hex:'#FBE870'},{name:'Yellow-Green',hex:'#C5E17A'},{name:'Green',hex:'#01A368'},{name:'Blue-Green',hex:'#0095B7'},
    {name:'Blue',hex:'#0066FF'},{name:'Blue-Violet',hex:'#6456B7'},{name:'Violet',hex:'#8359A3'},{name:'Red-Violet',hex:'#BB3385'},
    {name:'Carnation Pink',hex:'#FFA6C9'},{name:'Brown',hex:'#AF593E'},{name:'Black',hex:'#000000'},{name:'White',hex:'#FFFFFF'}
  ];

  const layerNames=['Outer Layer','Layer 2','Layer 3','Layer 4'];
  const layers=[
    {R:233,r:89,p:58,scale:100,color:crayon16[10],enabled:true},
    {R:233,r:89,p:58,scale:90,color:crayon16[12],enabled:false},
    {R:233,r:89,p:58,scale:63,color:crayon16[4],enabled:false},
    {R:233,r:89,p:58,scale:44,color:crayon16[7],enabled:false}
  ];

  const state={layers,activeLayer:0,allSelected:false};
  const curveCaches=Array(LAYER_COUNT).fill(null);
  let renderQueued=false;
  let isDrawing=false;
  let drawRaf=null;

  function gcd(a,b){
    a=Math.abs(Math.round(a)); b=Math.abs(Math.round(b));
    while(b){const t=b;b=a%b;a=t}
    return a||1;
  }
  function thetaMax(R,r){return Math.PI*2*(r/gcd(R,r))}
  function spiroPoint(theta,R,r,pPct){
    const p=(pPct/100)*r;
    const k=(R-r)/r;
    return{x:(R-r)*Math.cos(theta)+p*Math.cos(k*theta),y:(R-r)*Math.sin(theta)-p*Math.sin(k*theta)};
  }
  function invalidateLayer(i){curveCaches[i]=null}

  function computeRawCurve(i){
    const layer=state.layers[i];
    const key=`${layer.R}|${layer.r}|${layer.p}`;
    const cached=curveCaches[i];
    if(cached?.key===key)return cached;

    const end=thetaMax(layer.R,layer.r);
    const step=Math.max(.0045,end/28000);
    const pts=[];
    let maxRadius=1;

    for(let theta=0;theta<=end+1e-9;theta+=step){
      const pt=spiroPoint(theta,layer.R,layer.r,layer.p);
      maxRadius=Math.max(maxRadius,Math.hypot(pt.x,pt.y));
      pts.push(pt);
    }

    const endPt=spiroPoint(end,layer.R,layer.r,layer.p);
    pts.push(endPt);
    maxRadius=Math.max(maxRadius,Math.hypot(endPt.x,endPt.y));
    return curveCaches[i]={key,pts,maxRadius};
  }

  function resizeCanvas(){
    const rect=canvas.getBoundingClientRect();
    const size=Math.floor(Math.min(rect.width,rect.height)*devicePixelRatio);
    if(size>0&&(canvas.width!==size||canvas.height!==size)){canvas.width=size;canvas.height=size}
  }
  function guideRadius(){return Math.min(canvas.width,canvas.height)*.455}
  function scaledPoints(i){
    const raw=computeRawCurve(i);
    const layer=state.layers[i];
    const scale=(guideRadius()/raw.maxRadius)*(layer.scale/100);
    const cx=canvas.width/2,cy=canvas.height/2;
    return raw.pts.map(pt=>({x:cx+pt.x*scale,y:cy+pt.y*scale}));
  }
  function rgba(hex,a){
    const h=hex.slice(1);
    return`rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},${a})`;
  }
  function drawGuide(){
    const cx=canvas.width/2,cy=canvas.height/2;
    ctx.save();
    ctx.strokeStyle='#171a20';
    ctx.lineWidth=Math.max(1,canvas.width*.0014);
    ctx.beginPath();ctx.arc(cx,cy,guideRadius(),0,Math.PI*2);ctx.stroke();
    ctx.restore();
  }
  function drawLayer(i){
    const layer=state.layers[i];
    const points=scaledPoints(i);
    if(points.length<2)return;
    ctx.save();
    ctx.lineCap='round';ctx.lineJoin='round';
    ctx.strokeStyle=rgba(layer.color.hex,.98);
    ctx.lineWidth=(i===0?1.15:1)*(canvas.width/1024);
    ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);
    for(let j=1;j<points.length;j++)ctx.lineTo(points[j].x,points[j].y);
    ctx.stroke();ctx.restore();
  }
  function render(){
    renderQueued=false;
    resizeCanvas();
    ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width,canvas.height);
    drawGuide();
    for(let i=0;i<LAYER_COUNT;i++)if(state.layers[i].enabled)drawLayer(i);
    drawGuide();
  }
  function queueRender(){if(isDrawing)return;if(!renderQueued){renderQueued=true;requestAnimationFrame(render)}}

  function selectedIndices(){return state.allSelected?[0,1,2,3]:[state.activeLayer]}
  function applyToSelected(fn){selectedIndices().forEach(i=>fn(state.layers[i],i))}
  function targetLabel(){return state.allSelected?'All Layers':layerNames[state.activeLayer]}

  function refreshPaletteAndSelectors(){
    const activeColor=state.allSelected?null:state.layers[state.activeLayer].color.hex;
    [...document.getElementById('sharedPalette').children].forEach((btn,i)=>btn.classList.toggle('selected',activeColor===crayon16[i].hex));
    document.querySelectorAll('.layer-select-btn').forEach(btn=>btn.classList.toggle('active',!state.allSelected&&+btn.dataset.layer===state.activeLayer));
    allBtn.classList.toggle('active',state.allSelected);
    for(let i=0;i<LAYER_COUNT;i++)document.getElementById(`layerDot${i}`).style.background=state.layers[i].color.hex;
  }

  function syncUI(){
    const indices=selectedIndices();
    const label=targetLabel();
    const allOn=indices.every(i=>state.layers[i].enabled);
    paletteHeading.textContent=`Color ${label}`;
    visibilityBtn.classList.toggle('on',allOn);
    visibilityBtn.textContent=`${label} ${allOn?'On':'Off'}`;
    sizeReadout.textContent=`Size ${label}`;
    randomBtn.textContent=`Change ${label}`;
    refreshPaletteAndSelectors();
  }

  visibilityBtn.addEventListener('click',()=>{
    const turnOn=!selectedIndices().every(i=>state.layers[i].enabled);
    applyToSelected(layer=>layer.enabled=turnOn);
    syncUI();queueRender();
  });

  function nudgeSize(delta){
    applyToSelected(layer=>layer.scale=Math.max(10,Math.min(100,layer.scale+delta)));
    syncUI();queueRender();
  }
  sizeMinus.addEventListener('click',()=>nudgeSize(-5));
  sizePlus.addEventListener('click',()=>nudgeSize(5));

  randomBtn.addEventListener('click',()=>{
    randomBtn.classList.remove('flash');
    void randomBtn.offsetWidth;
    randomBtn.classList.add('flash');
    setTimeout(()=>randomBtn.classList.remove('flash'),220);

    selectedIndices().forEach(i=>{
      const layer=state.layers[i];
      layer.R=Math.round(40+Math.random()*280);
      layer.r=Math.round(10+Math.random()*210);
      layer.p=Math.round(5+Math.random()*90);
      invalidateLayer(i);
    });
    syncUI();queueRender();
  });

  function drawSnapshot(){
    if(isDrawing)return;
    resizeCanvas();

    const snapshot=[];
    for(let i=0;i<LAYER_COUNT;i++){
      const layer=state.layers[i];
      if(!layer.enabled)continue;
      const points=scaledPoints(i);
      snapshot.push({
        points,
        color:layer.color.hex,
        lineWidth:(i===0?1.15:1)*(canvas.width/1024),
        lastIndex:0
      });
    }

    isDrawing=true;
    renderQueued=false;
    drawBtn.disabled=true;
    drawBtn.textContent='Drawing…';
    ctx.fillStyle='#000';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    const duration=20000;
    const start=performance.now();

    function frame(now){
      const t=Math.min(1,(now-start)/duration);

      for(const layer of snapshot){
        const pts=layer.points;
        if(pts.length<2)continue;
        const target=Math.max(1,Math.floor((pts.length-1)*t));
        if(target<=layer.lastIndex)continue;

        ctx.save();
        ctx.lineCap='round';
        ctx.lineJoin='round';
        ctx.strokeStyle=rgba(layer.color,.98);
        ctx.lineWidth=layer.lineWidth;
        ctx.beginPath();
        ctx.moveTo(pts[layer.lastIndex].x,pts[layer.lastIndex].y);
        for(let j=layer.lastIndex+1;j<=target;j++)ctx.lineTo(pts[j].x,pts[j].y);
        ctx.stroke();
        ctx.restore();
        layer.lastIndex=target;
      }

      if(t<1){
        drawRaf=requestAnimationFrame(frame);
      }else{
        isDrawing=false;
        drawRaf=null;
        drawBtn.disabled=false;
        drawBtn.textContent='Draw';
        render();
      }
    }

    drawRaf=requestAnimationFrame(frame);
  }

  drawBtn.addEventListener('click',drawSnapshot);

  function buildPalette(){
    const container=document.getElementById('sharedPalette');
    crayon16.forEach(color=>{
      const btn=document.createElement('button');
      btn.type='button';btn.className='swatch-button';btn.title=color.name;btn.style.background=color.hex;
      if(color.hex==='#FFFFFF')btn.style.borderColor='rgba(0,0,0,.28)';
      btn.addEventListener('click',()=>{applyToSelected(layer=>layer.color=color);syncUI();queueRender()});
      container.appendChild(btn);
    });

    document.querySelectorAll('.layer-select-btn').forEach(btn=>btn.addEventListener('click',()=>{
      state.allSelected=false;
      state.activeLayer=+btn.dataset.layer;
      state.layers[state.activeLayer].enabled=true;
      syncUI();queueRender();
    }));

    allBtn.addEventListener('click',()=>{
      state.allSelected=true;
      state.layers.forEach(layer=>layer.enabled=true);
      syncUI();queueRender();
    });
  }

  function syncPanelHeight(){
    const h=Math.round(stageShell.getBoundingClientRect().height);
    if(h>0){controlPanel.style.height=`${h}px`;controlPanel.style.maxHeight=`${h}px`}
  }

  new ResizeObserver(()=>{syncPanelHeight();queueRender()}).observe(stageShell);
  window.addEventListener('resize',()=>{syncPanelHeight();queueRender()});

  buildPalette();
  syncPanelHeight();
  syncUI();
  queueRender();
})();
</script>
</body>
</html>
