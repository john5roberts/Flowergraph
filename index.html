<script>
const GENERATORS={};
GENERATORS["dahlia"] = (recipe) => {
 const state={seed:recipe.seed,style:recipe.style,geometry:[],recipe:null, colors:{},mode:'2d'};
 const TAU=Math.PI*2, GOLD=Math.PI*(3-Math.sqrt(5));

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const hash=(i,k=0)=>{let x=Math.sin(i*127.1+k*311.7+state.seed*7.71)*43758.5453;return x-Math.floor(x)};

function lerp(a,b,t){return a+(b-a)*t;}
function flowerRecipe(){
  const r=k=>hash(-1000,k);
  const count=Math.round(lerp(165,275,r(1))/5)*5;
  const layers=Math.max(7,Math.min(15,Math.round(lerp(8,14.5,r(2)))));
  const curlPct=lerp(36,68,r(3));
  const fullnessPct=lerp(82,124,r(4));
  const irregularPct=lerp(10,34,r(5));
  const lengthScale=lerp(.82,1.18,r(6));
  const widthScale=lerp(.82,1.18,r(7));
  const spreadScale=lerp(.92,1.10,r(8));
  const centerLift=lerp(.88,1.18,r(9));
  return {count,layers,curlPct,fullnessPct,irregularPct,lengthScale,widthScale,spreadScale,centerLift};
}
function buildPetals(){
  state.recipe=flowerRecipe();
  const petals=[];
  const {count:N,layers:L,curlPct,fullnessPct,irregularPct,lengthScale,widthScale,spreadScale,centerLift}=state.recipe;
  for(let i=0;i<N;i++){
    const t=(i+.5)/N;
    const ring=Math.min(L-1,Math.floor(t*L));
    const f=(ring+.5)/L;
    const angle=i*GOLD;
    const j=(hash(i,1)-.5)*irregularPct/100;
    const rad=(.045+Math.pow(f,.84)*.66)*spreadScale;
    const height=.32*(1-f)*(1-f)*centerLift;
    const length=(.12+.52*Math.pow(f,.83))*lengthScale*(fullnessPct/100)*(1+j*.8);
    const width=(.047+.13*Math.pow(f,.75))*widthScale*(1+j);
    const lift=(.24*(1-f)-.12*f)*(0.92+.18*centerLift);
    const curl=(curlPct/100)*(.10+.17*f);
    const twist=(hash(i,2)-.5)*irregularPct/100*.6;
    petals.push({ring,ringFrac:f,angle:angle+j,rad,height,length,width,lift,curl,twist,i,layers:L});
  }
  return petals;
}
function surf(p,u,w){
  const a=p.angle, radial=[Math.cos(a),Math.sin(a)], side=[-Math.sin(a),Math.cos(a)];
  const span=p.width*Math.pow(Math.sin(Math.PI*clamp(u,0,1)),.70)*(1-.3*u);
  const reach=p.rad+p.length*u;
  const twist=w*span+p.twist*u;
  const x=radial[0]*reach+side[0]*twist;
  const y=radial[1]*reach+side[1]*twist;
  const z=p.height+p.lift*u+p.curl*u*u+(.055+.065*((state.recipe?.curlPct||52)/100))*w*w*Math.sin(Math.PI*u)-p.curl*.55*Math.pow(u,4);
  return {x,y,z};
}
function pushLine(lines,points,width,alpha){ if(points.length>1) lines.push({points,width,alpha,color:'#df679a'}); }
function lineAtW(p,w,samples=22){ const pts=[]; for(let j=0;j<=samples;j++) pts.push(surf(p,j/samples,w)); return pts; }
function lineAtU(p,u,samples=12){ const pts=[]; for(let j=0;j<=samples;j++) pts.push(surf(p,u,-1+2*j/samples)); return pts; }
function styleFillForPetal(style,p){
  const outer=p.ringFrac;
  if(style==='simple'){
    const ws = outer>.72 ? [-.42,0,.42] : outer>.48 ? [0] : [];
    const us = outer>.72 ? [.32,.58,.82] : outer>.48 ? [.48] : [];
    return {ws,us,longAlpha:.16,crossAlpha:.12};
  }
  if(style==='rich'){
    const ws = outer>.82 ? [-.70,-.42,-.16,0,.16,.42,.70] : outer>.60 ? [-.46,-.12,.12,.46] : outer>.36 ? [-.18,.18] : [];
    const us = outer>.82 ? [.18,.30,.42,.54,.66,.78,.90] : outer>.60 ? [.28,.46,.64,.82] : outer>.36 ? [.52,.74] : [];
    return {ws,us,longAlpha:.23,crossAlpha:.17};
  }
  const ws = outer>.84 ? [-.78,-.56,-.34,-.12,.12,.34,.56,.78] : outer>.64 ? [-.54,-.30,-.08,.08,.30,.54] : outer>.42 ? [-.28,0,.28] : [];
  const us = outer>.84 ? [.16,.26,.36,.46,.56,.66,.76,.86,.94] : outer>.64 ? [.24,.38,.52,.66,.80,.92] : outer>.42 ? [.44,.62,.80] : [];
  return {ws,us,longAlpha:.25,crossAlpha:.19};
}
function build(){
  const petals=buildPetals(), lines=[];
  for(const p of petals){
    // Structural lines common to all styles.
    pushLine(lines,lineAtW(p,-1),1.00,.34);
    pushLine(lines,lineAtW(p,1),1.00,.34);
    pushLine(lines,lineAtW(p,0),.74,.16);
    pushLine(lines,lineAtU(p,.97,10),.52,.18);
    // Interior color-in lines only.
    const fill=styleFillForPetal(state.style,p);
    for(const w of fill.ws) pushLine(lines,lineAtW(p,w),.62,fill.longAlpha);
    for(const u of fill.us) pushLine(lines,lineAtU(p,u,10),.50,fill.crossAlpha);
  }
  state.geometry=lines;
}

 build();
 return state.geometry;
};
GENERATORS["iris"] = (recipe) => {
 const state={seed:recipe.seed,style:recipe.style,geometry:[],recipe:null, colors:{},mode:'2d'};
 const TAU=Math.PI*2, GOLDEN=Math.PI*(3-Math.sqrt(5));

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const add=(a,b)=>({x:a.x+b.x,y:a.y+b.y,z:a.z+b.z});
const mul=(a,k)=>({x:a.x*k,y:a.y*k,z:a.z*k});
const norm=v=>{const m=Math.hypot(v.x,v.y,v.z)||1;return mul(v,1/m)};
function rng(seed){let s=seed>>>0;return ()=>{s=(Math.imul(1664525,s)+1013904223)>>>0;return s/4294967296}}
function build(){
 const r=rng(state.seed),rand=(a,b)=>a+(b-a)*r(),style=state.style;
 const rich=style==='rich',wild=style==='wandering',simple=style==='simple';
 const lines=[];function line(points,color,width=1,alpha=1){if(points.length>1)lines.push({points,color,width,alpha})}
 const petalColors=['#ae85dc','#b697e6','#ccacec','#8f69c2','#a57cd0','#bd98df'];
 const lime='#d8b550',beard='#e5aa43',green='#6ea46e';
 const head={x:0,y:-.55,z:0};
 // Stem bends gently as it approaches the flower.
 const stemPts=[];for(let j=0;j<=38;j++){const t=j/38;stemPts.push({x:.08*Math.sin(2.8*t+.2)*t,y:1.75-2.30*t,z:.065*Math.sin(3*t+.6)*t})}line(stemPts,green,2.3,.90);
 function blade(base,az,length,width,bend){
   function point(t,v){const w=width*Math.sin(Math.PI*Math.pow(t,.86))*(.92+.08*t);
     const lean=bend*t*t;return{x:base.x+Math.cos(az)*lean + -Math.sin(az)*v*w,y:base.y-length*t+.14*Math.sin(Math.PI*t),z:base.z+Math.sin(az)*lean+Math.cos(az)*v*w};}
   for(const v of [-1,-.42,0,.42,1]){const pts=[];for(let i=0;i<=42;i++)pts.push(point(i/42,v));line(pts,green,v===0?1.1:.75,v===0?.85:.43)}
   for(let i=1;i<8;i++){const pts=[];for(let j=0;j<=10;j++)pts.push(point(i/8,-1+2*j/10));line(pts,green,.50,.23)}
 }
 // Sword-shaped foliage originates well below the blossom.
 for(let i=0;i<(simple?2:3);i++){
  const a=i*2.55+rand(-.18,.18),base={x:rand(-.06,.06),y:1.55+rand(-.10,.08),z:rand(-.06,.06)};
  // Leaf points up from its lower attachment, bends away from stem.
  function lp(t,v){const rad=.2*t+.42*t*t; const w=.13*Math.sin(Math.PI*Math.pow(t,.76));return{x:base.x+rad*Math.cos(a)-v*w*Math.sin(a),y:base.y-1.72*t+rad*.17,z:base.z+rad*Math.sin(a)+v*w*Math.cos(a)}}
  for(const v of [-1,0,1]){let pts=[];for(let j=0;j<=45;j++)pts.push(lp(j/45,v));line(pts,green,v===0?1.12:.84,v===0?.74:.54)}
 }
 // Three upright standards and three downward-arching falls.
 function petal(az,isFall,idx){
  const length=(isFall?1.13:.98)*rand(.91,1.10),maxWidth=(isFall?.34:.30)*rand(.90,1.11);
  const twist=rand(-.17,.17)*(wild?2.6:rich?1.4:.60);
  const phase=rand(0,6.283),flutter=wild?.105:rich?.055:.019;
  const roll=isFall?rand(.11,.22):rand(.09,.17);
  const color=petalColors[(idx+(isFall?3:0))%petalColors.length];
  function pos(u,v){
   const angle=az+twist*u*u;
   const outward=isFall?.13+1.02*Math.pow(u,1.22):.12+.33*u*u;
   const rise=isFall?(-.24*u+.72*u*u):(-1.00*u+.14*u*u);
   const widen=Math.pow(Math.sin(Math.PI*u),.76)*(1-.11*u);
   const w=maxWidth*widen;
   const edgeRuffle=flutter*Math.pow(u,2)*Math.pow(Math.abs(v),2.4)*Math.sin(9*Math.PI*u+phase+v*1.7);
   const cup=roll*(v*v)*Math.sin(Math.PI*u);
   const tipBend=.10*Math.pow(u,3);
   return {x:head.x+Math.cos(angle)*(outward*length+cup+edgeRuffle)+(-Math.sin(angle))*v*w,
       y:head.y+rise*length+tipBend+(isFall?.055:-.045)*(v*v)*Math.sin(Math.PI*u)+edgeRuffle*.38,
       z:head.z+Math.sin(angle)*(outward*length+cup+edgeRuffle)+Math.cos(angle)*v*w};
  }
  // Keep the ORIGINAL SIX PETALS and their surfaces unchanged.
  // Fill is created by sampling more curves ON each original petal, not by adding petals.
  const steps=64;
  const contourCount=simple?7:rich?48:108;
  for(let k=0;k<contourCount;k++){
   const v=contourCount===1?0:-1+2*k/(contourCount-1);
   const pts=[];for(let j=0;j<=steps;j++)pts.push(pos(j/steps,v));
   const edge=Math.abs(v)>.995,mid=Math.abs(v)<.008;
   line(pts,color,edge?1.45:mid?1.15:(simple?.67:rich?.86:.98),
      edge?.96:mid?.76:(simple?.46:rich?.52:.60));
  }
  // Close cross-hatching adds apparent color mass, without altering the petal silhouette.
  const crossN=simple?8:rich?30:68;
  for(let j=1;j<=crossN;j++){
   const u=j/(crossN+1),pts=[];
   for(let k=0;k<=32;k++)pts.push(pos(u,-1+2*k/32));
   line(pts,color,simple?.66:rich?.73:.80,simple?.19:rich?.36:.50);
  }
  // A second oblique fiber pass only in richer modes gives a gently woven fill.
  if(!simple){
   const diagonalN=rich?16:42;
   for(let j=0;j<diagonalN;j++){
    const u0=(j+.5)/diagonalN;
    for(const side of [-1,1]){
     const pts=[];
     for(let k=0;k<=14;k++){
      const q=k/14;
      const u=clamp(u0+(q-.5)*(rich?.10:.14),.015,.985);
      const v=side*(-.96+1.92*q);
      pts.push(pos(u,v));
     }
     line(pts,color,rich?.60:.70,rich?.23:.35);
    }
   }
  }
  // Gold beards near the lower petal throat: short fine hairs.
  if(isFall){for(let k=0;k<(simple?12:rich?22:32);k++){
   const u=rand(.13,.33),v=rand(-.19,.19),root=pos(u,v),angle=rand(0,TAU),height=rand(.025,.074);
   line([root,{x:root.x+Math.sin(angle)*height*.28,y:root.y-height,z:root.z+Math.cos(angle)*height*.30}],beard,.74,.82);
  }}
 }
 // Draw far standards first, then prominent descending falls.
 for(let i=0;i<3;i++)petal(i*TAU/3+.15,false,i);
 for(let i=0;i<3;i++)petal(i*TAU/3+TAU/6+.15,true,i);
 for(let i=0;i<9;i++){const a=i*TAU/9,pts=[];for(let k=0;k<=16;k++){
  const u=k/16,rad=.045+.015*u;pts.push({x:head.x+Math.cos(a)*rad*u,y:head.y-.12*u,z:head.z+Math.sin(a)*rad*u});
 }line(pts,lime,.82,.72)}
 state.geometry=lines;
}

 build();
 return state.geometry;
};
GENERATORS["lace"] = (recipe) => {
 const state={seed:recipe.seed,style:recipe.style,geometry:[],recipe:null, colors:{},mode:'2d'};
 const TAU=Math.PI*2, GOLDEN=Math.PI*(3-Math.sqrt(5));

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const add=(a,b)=>({x:a.x+b.x,y:a.y+b.y,z:a.z+b.z});
const mul=(a,k)=>({x:a.x*k,y:a.y*k,z:a.z*k});
const norm=v=>{const m=Math.hypot(v.x,v.y,v.z)||1;return mul(v,1/m)};
function rng(seed){let s=seed>>>0;return ()=>{s=(Math.imul(1664525,s)+1013904223)>>>0;return s/4294967296}}
function build(){
 const r=rng(state.seed),rand=(a,b)=>a+(b-a)*r(),style=state.style;
 const rich=style==='rich',wild=style==='wandering';
 const count=style==='simple'?15:rich?24:30,sec=style==='simple'?5:rich?7:9;
 const lines=[];function line(points,color,width=1,alpha=1){lines.push({points,color,width,alpha})}
 const green='#73a976', pale='#ecebd0', cream='#d4c99b', stem='#71966c';
 const length=2.45;
 const stemAt=t=>({x:0.10*Math.sin(t*3+0.3)*t+.05*t,y:1.70-length*t,z:.045*Math.sin(4*t+.5)*t});
 const stemPts=[];for(let j=0;j<=36;j++)stemPts.push(stemAt(j/36));line(stemPts,stem,2.0,.9);
 const crown=stemAt(1), major=[];
 // The umbel's structural rays form a flattened dome: longer rays around the outside.
 for(let i=0;i<count;i++){
  const a=i*GOLDEN+rand(-.10,.10),radial=norm({x:Math.cos(a),y:0,z:Math.sin(a)});
  const radius=rand(.82,1.06)*(wild?rand(.79,1.12):1),height=rand(.23,.40);
  const end=add(crown,{x:radial.x*radius,y:-height+rand(-.06,.06),z:radial.z*radius});
  const middle=add(crown,{x:radial.x*radius*.47,y:-height*.55-.12,z:radial.z*radius*.47});
  line([crown,middle,end],green,1.2,.80);major.push({center:end,radial,a});
 }
 // The central zone is filled using smaller umbels to avoid an artificial hollow ring.
 for(let i=0;i<Math.floor(count*.47);i++){
  const a=i*GOLDEN+1.7,rad=rand(.25,.68),end=add(crown,{x:Math.cos(a)*rad,y:-rand(.34,.48),z:Math.sin(a)*rad});
  line([crown,add(crown,{x:Math.cos(a)*rad*.45,y:-.20,z:Math.sin(a)*rad*.45}),end],green,.95,.7);
  major.push({center:end,radial:{x:Math.cos(a),y:0,z:Math.sin(a)},a});
 }
 function blossom(c,size,twist){
  // A flower is five tiny pointed petals oriented approximately toward the viewer.
  const centerSize=size*.22;
  for(let p=0;p<5;p++){
   const a=p*TAU/5+twist;
   const edge1={x:Math.cos(a-.33),z:Math.sin(a-.33)},edge2={x:Math.cos(a+.33),z:Math.sin(a+.33)};
   const tip={x:c.x+Math.cos(a)*size,y:c.y-rand(.001,.014),z:c.z+Math.sin(a)*size};

function drawLibraryCanvas(){const w=canvas.width,h=canvas.height,n=stored.library.length;if(!n){ctx.fillStyle='#8e929e';ctx.textAlign='center';ctx.font=`${Math.max(14,Math.round(w/33))}px sans-serif`;ctx.fillText('Your flower library is empty',w/2,h/2);return;}const active=stored.library.find(f=>f.id===app.libSelected);if(active){paint(ctx,active.recipe,{x:0,y:0,w,h},{mode:'3d',rx:-.22,ry:.30,zoom:app.zoom});return;}const list=stored.library.slice(0,9),cols=3,rows=Math.ceil(list.length/cols),cell=Math.min(w/cols,h/Math.max(3,rows));for(let i=0;i<list.length;i++){const col=i%cols,row=Math.floor(i/cols),x=(w-cell*cols)/2+col*cell,y=h*.10+row*cell;paint(ctx,list[i].recipe,{x,y,w:cell,h:cell},{mode:'3d',rx:-.21,ry:.25,zoom:.82});ctx.fillStyle='#c7c7ca';ctx.textAlign='center';ctx.font=`${Math.max(11,Math.round(cell/11))}px sans-serif`;ctx.fillText(list[i].name,x+cell/2,y+cell*.94,cell*.93);}if(n>9){ctx.fillStyle='#aaa';ctx.font=`${Math.max(11,Math.round(w/34))}px sans-serif`;ctx.fillText(`+ ${n-9} more in library`,w/2,h*.96);}}
function button(label,action,extra=''){return `<button class="btn ${extra}" data-action="${action}">${label}</button>`;}
function flowerButtons(selected){return `<div class="flower-grid">${TYPES.map(([id,name])=>`<button class="flower-option ${selected===id?'active':''}" data-flower="${id}">${name}</button>`).join('')}</div>`;}
function dataSection(){return `<div class="section"><h3>GitHub JSON Data</h3><p class="hint" id="dataStatus">${escapeHtml(dataStatus)}</p>${button('Download Updated JSON','export','wide primary')}<div class="row" style="margin-top:8px">${button('Import JSON','import','mini')}${button('Reload GitHub JSON','reload','mini')}</div><p class="hint">Place ${DATA_FILE} beside the HTML file in your GitHub repository. Opening the hosted app reads it automatically. Changes are saved locally until you download the updated JSON and replace the file on GitHub.</p></div>`;}
function renderControls(){
 document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===app.tab));
 const creating=app.tab==='create'&&!!app.draft;
 $('draw').classList.toggle('control-off',!creating);$('rotate').classList.toggle('control-off',!creating);$('dimension').classList.toggle('control-off',!creating);
 stage.classList.toggle('placing',app.tab==='arrange'&&app.placing);stage.classList.toggle('moving',app.tab==='arrange'&&!app.placing);
 $('arrangeBadge').classList.toggle('hidden',app.tab!=='arrange');
 const source=stored.library.find(f=>f.id===app.placeId);
 $('arrangeBadge').textContent=app.placing?`Tap to place ${source?.name||'flower'}`:'Drag a flower to move it';
 let html='';
 if(app.tab==='create'){
  html=`<div class="section"><h3>Choose a Flower</h3>${flowerButtons(app.draft?.type)}${!app.draft?'<p class="hint">Select a flower to begin. The canvas stays empty until then.</p>':''}</div>`;
  if(app.draft){
   html+=`<div class="section"><h3>Flower Style</h3><div class="styles">${['simple','rich','wandering'].map(s=>button(s[0].toUpperCase()+s.slice(1),'style:'+s,app.draft.style===s?'active':'' )).join('')}</div>${button('New Flower','new','wide primary')}</div>`;
   html+=`<div class="section"><h3>Stem</h3><div class="control-label"><span>Stem Width</span><span id="stemValue">${app.draft.stemWidth}%</span></div><input aria-label="Stem width" id="stemWidth" class="range" type="range" min="10" max="100" step="5" value="${app.draft.stemWidth}"><div class="hint">Narrow ← → Wide</div></div>`;
   html+=`<div class="section"><h3>Colors</h3><div class="colors-row">${[['flower','Flower'],['stem','Stem'],['detail','Detail']].map(([key,label])=>`<button class="btn mini" data-color="${key}"><span class="dot" style="background:${app.draft.colors[key]}"></span>${label}</button>`).join('')}</div><div class="palette hidden" id="palette"></div></div>`;
   html+=`<div class="section">${app.editingId?`<p class="hint">Editing ${escapeHtml(stored.library.find(f=>f.id===app.editingId)?.name||'saved flower')}</p>`:''}${button('Save as New Flower','saveNew','wide primary')}${app.editingId?button('Update This Saved Flower','update','wide'):''}${button('Download Updated JSON','export','wide')}<p class="hint">Each Save adds a version to your working library. Download the JSON when ready to publish it on GitHub.</p></div>`;
  }
 }else if(app.tab==='library'){
  if(!stored.library.length){html=`<div class="empty">Your flower library is empty.<br>Create a flower and select Save as New Flower.</div>${button('Create a Flower','create','wide primary')}`;}
  else{
   html=`<div class="section"><h3>Saved Flowers (${stored.library.length})</h3><div class="saved-grid">${stored.library.map(f=>`<button data-saved="${escapeHtml(f.id)}" class="saved-option ${f.id===app.libSelected?'active':''}"><img class="preview" alt="" src="${makeThumb(f)}"><span>${escapeHtml(f.name)}</span></button>`).join('')}</div></div>`;
   const selected=stored.library.find(f=>f.id===app.libSelected);
   if(selected)html+=`<div class="section"><h3>${escapeHtml(selected.name)}</h3>${button('Place Flower','place','wide primary')}${button('Edit Flower','edit','wide')}${button('Remove from Library','delLib','wide mini')}</div>`;
  }
  html+=dataSection();
 }else{
  const item=stored.arrangement.find(a=>a.id===app.selected),n=stored.arrangement.length;
  html=`<div class="section"><h3>Arrange Flowers</h3><p class="hint">${app.placing?'Tap empty space to add another copy. Drag any flower to move it.':'Touch and drag a flower to move it. Release anywhere.'}</p>${app.placing?button('Done Placing','donePlace','wide primary'):button('Choose Flower to Place','choosePlace','wide primary')}</div>`;
  html+=`<div class="section"><h3>Breeze — Test Settings</h3><div class="styles">${['still','gentle','windy'].map(k=>button(k[0].toUpperCase()+k.slice(1),'breeze:'+k,breeze.strength===k?'active':'' )).join('')}</div>${button(breeze.playing?'Pause Breeze':'Start Breeze','breezeToggle','wide primary')}<p class="hint">Temporary breeze controls. The animation setting is not part of the saved JSON.</p></div>`;
  if(app.placing&&source)html+=`<div class="section"><h3>Adding: ${escapeHtml(source.name)}</h3>${button('Choose Another Flower','choosePlace','wide')}</div>`;
  if(item)html+=`<div class="section"><h3>Selected: ${escapeHtml(item.flowerName||LABEL[item.recipe.type])}</h3><div class="row">${button('− Smaller','smaller')}${button('+ Larger','larger')}</div><div class="layer-controls" style="margin-top:8px">${button('Send Back','back','mini')}${button('Bring Forward','front','mini')}</div>${button('Remove Flower','remove','wide mini')}<p class="hint">Tap and drag to move this flower.</p></div>`;
  html+=`<div class="section"><p class="muted">${n} flower${n===1?'':'s'} in arrangement</p>${button('Clear Arrangement','clear','wide mini')}</div>`+dataSection();
 }
 controls.innerHTML=html;
 controls.querySelectorAll('[data-flower]').forEach(b=>b.onclick=()=>{app.draft=G(b.dataset.flower,'rich');app.editingId=null;app.zoom=1;app.drawProgress=1;renderControls();queue();});
 controls.querySelectorAll('[data-saved]').forEach(b=>b.onclick=()=>{app.libSelected=b.dataset.saved;renderControls();queue();});
 controls.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{const pal=$('palette');pal.classList.remove('hidden');pal.innerHTML=COLORS.map(col=>`<button class="swatch ${col===app.draft.colors[b.dataset.color]?'active':''}" title="${col}" data-swatch="${col}" style="background:${col}"></button>`).join('');pal.querySelectorAll('[data-swatch]').forEach(s=>s.onclick=()=>{app.draft.colors[b.dataset.color]=s.dataset.swatch;renderControls();queue();});});
 controls.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.action));
 const slider=$('stemWidth');if(slider)slider.oninput=()=>{app.draft.stemWidth=Number(slider.value);$('stemValue').textContent=`${app.draft.stemWidth}%`;queue();};
}
function tab(t){app.tab=t;if(t==='arrange')app.placing=false;renderControls();queue();}
function confirmDialog(title,message,yesLabel,onYes){$('modalTitle').textContent=title;$('modalBody').textContent=message;$('modalConfirm').textContent=yesLabel;$('modal').classList.add('open');$('modalCancel').onclick=()=>$('modal').classList.remove('open');$('modalConfirm').onclick=()=>{$('modal').classList.remove('open');onYes();};}
function selectedFlower(){return stored.library.find(f=>f.id===app.libSelected);}
function placeMode(id){if(!stored.library.some(f=>f.id===id)){notify('Select a saved flower first.');return;}app.placeId=id;app.placing=true;app.selected=null;app.tab='arrange';renderControls();queue();}
function nextName(type){let n=1;const existing=new Set(stored.library.map(f=>f.name));while(existing.has(LABEL[type]+' '+n))n++;return LABEL[type]+' '+n;}
function resetDataSelection(){app.selected=null;app.libSelected=null;app.placeId=null;app.placing=false;app.editingId=null;}
function downloadJSON(){const file=new Blob([JSON.stringify(stored,null,2)+'\n'],{type:'application/json'});const url=URL.createObjectURL(file);const link=document.createElement('a');link.href=url;link.download=DATA_FILE;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);notify('JSON downloaded — replace the file on GitHub to publish changes.');}
function act(a){
 if(a.startsWith('breeze:')){breeze.strength=a.split(':')[1];breeze.playing=breeze.strength!=='still';breeze.last=0;}
 else if(a==='breezeToggle'){if(breeze.strength==='still')breeze.strength='gentle';breeze.playing=!breeze.playing;breeze.last=0;}
 else if(a.startsWith('style:')&&app.draft){app.draft.style=a.split(':')[1];}
 else if(a==='new'&&app.draft){app.draft.seed=(Math.random()*4294967295)>>>0;app.editingId=null;}
 else if(a==='saveNew'&&app.draft){const record={id:uid(),name:nextName(app.draft.type),recipe:structuredClone(app.draft),createdAt:new Date().toISOString()};stored.library.push(record);app.libSelected=record.id;app.editingId=record.id;save();notify(`${record.name} saved locally. Download JSON to publish.`);}
 else if(a==='update'&&app.draft){const entry=stored.library.find(f=>f.id===app.editingId);if(entry){confirmDialog('Update saved flower?',`Update ${entry.name}? Already placed flowers will keep their original designs.`,'Update',()=>{entry.recipe=structuredClone(app.draft);thumbCache.clear();save();renderControls();queue();notify(`${entry.name} updated locally.`);});return;}}
 else if(a==='create')tab('create');
 else if(a==='place'){const f=selectedFlower();if(f){placeMode(f.id);return;}}
 else if(a==='edit'){const f=selectedFlower();if(f){app.draft=structuredClone(f.recipe);app.editingId=f.id;app.drawProgress=1;tab('create');return;}}
 else if(a==='delLib'){const f=selectedFlower();if(f){confirmDialog('Remove saved flower?',`Remove ${f.name}? Flowers already placed in Arrange will remain.`, 'Remove',()=>{stored.library=stored.library.filter(v=>v.id!==f.id);if(app.editingId===f.id)app.editingId=null;app.libSelected=null;thumbCache.clear();save();renderControls();queue();});return;}}
 else if(a==='donePlace'){app.placing=false;}
 else if(a==='choosePlace'){app.placing=false;tab('library');return;}
 else if(a==='smaller'||a==='larger'){const i=stored.arrangement.find(e=>e.id===app.selected);if(i){i.size=clamp(i.size+(a==='smaller'?-.045:.045),.12,1.15);save();}}
 else if(a==='front'||a==='back'){const i=stored.arrangement.find(e=>e.id===app.selected);if(i){let orders=stored.arrangement.map(e=>e.order);i.order=a==='front'?Math.max(...orders)+1:Math.min(...orders)-1;save();}}
 else if(a==='remove'){stored.arrangement=stored.arrangement.filter(e=>e.id!==app.selected);app.selected=null;save();}
 else if(a==='clear'){confirmDialog('Clear arrangement?','This removes all flowers currently placed on the canvas. Your library will be kept.','Clear',()=>{stored.arrangement=[];app.selected=null;save();renderControls();queue();});return;}
 else if(a==='export'){downloadJSON();}
 else if(a==='import'){$('importFile').click();return;}
 else if(a==='reload'){if(dirty)confirmDialog('Reload GitHub JSON?', 'This replaces changes you have made locally since the last GitHub upload. Download JSON first to keep them.','Reload',()=>loadRemote(true));else loadRemote(true);return;}
 renderControls();queue();
}
$('importFile').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{const obj=normalizeData(JSON.parse(await f.text()));confirmDialog('Import Flowergraph JSON?',`Load ${obj.library.length} saved flowers and ${obj.arrangement.length} placed flowers? This replaces the current working library and arrangement.`,'Import',()=>{stored=obj;dirty=true;dataStatus='Imported JSON — download JSON to publish';cacheLocal();resetDataSelection();thumbCache.clear();renderControls();queue();notify('JSON loaded successfully');});}catch(err){notify('Invalid Flowergraph JSON file');console.error(err);}e.target.value='';});
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
const P=e=>{const r=canvas.getBoundingClientRect();return {x:clamp((e.clientX-r.left)/r.width,0,1),y:clamp((e.clientY-r.top)/r.height,0,1)};};let drag=null;
function hit(p){let list=[...stored.arrangement].sort((a,b)=>b.order-a.order);for(const a of list){let side=a.size,dx=(p.x-a.x)/(side*.55),dy=(p.y-a.y)/(side*.55);if(dx*dx+dy*dy<1.15)return a;}return null;}
canvas.addEventListener('pointerdown',e=>{
 if(app.tab!=='arrange'){if(app.tab==='create'&&app.draft&&app.mode==='3d'){drag={camera:true,x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);}return;}
 let p=P(e),item=hit(p);
 if(item){app.selected=item.id;drag={id:item.id,dx:p.x-item.x,dy:p.y-item.y};canvas.setPointerCapture(e.pointerId);stage.classList.add('dragging');renderControls();queue();}
 else if(app.placing){const f=stored.library.find(f=>f.id===app.placeId);if(!f){notify('Choose a saved flower first.');return;}let recipe=structuredClone(f.recipe),n=stored.arrangement.filter(i=>i.flowerId===f.id).length;let angle=(n*2.399963229728653+Math.random()*.35)%(Math.PI*2);let newItem={id:uid(),flowerId:f.id,flowerName:f.name,recipe,x:p.x,y:p.y,size:.35,rx:-.28+.2*Math.sin(n*1.9),ry:angle,order:stored.arrangement.length?Math.max(...stored.arrangement.map(x=>x.order))+1:0};stored.arrangement.push(newItem);app.selected=newItem.id;save();renderControls();queue();}
 else{app.selected=null;renderControls();queue();}e.preventDefault();
});
canvas.addEventListener('pointermove',e=>{if(!drag)return;if(drag.camera){let dx=e.clientX-drag.x,dy=e.clientY-drag.y;app.rotY+=dx*.009;app.rotX=clamp(app.rotX+dy*.009,-1.4,1.4);drag.x=e.clientX;drag.y=e.clientY;}else{let p=P(e),item=stored.arrangement.find(x=>x.id===drag.id);if(item){item.x=clamp(p.x-drag.dx,0,1);item.y=clamp(p.y-drag.dy,0,1);}}queue();e.preventDefault();});
function endDrag(){if(drag&&!drag.camera)save();drag=null;stage.classList.remove('dragging');}
canvas.addEventListener('pointerup',endDrag);canvas.addEventListener('pointercancel',endDrag);canvas.addEventListener('lostpointercapture',endDrag);
$('rotate').onclick=()=>{if(!app.draft)return;app.autoRotate=!app.autoRotate;if(app.autoRotate)app.mode='3d';$('rotate').classList.toggle('active',app.autoRotate);queue();};
$('dimension').onclick=()=>{if(!app.draft)return;app.mode=app.mode==='2d'?'3d':'2d';queue();};let hold=null,longTriggered=false;
$('dimension').addEventListener('pointerdown',()=>{longTriggered=false;clearTimeout(hold);hold=setTimeout(()=>{longTriggered=true;setFullscreen(true);},650);});$('dimension').addEventListener('pointerup',()=>clearTimeout(hold));$('dimension').addEventListener('pointercancel',()=>clearTimeout(hold));$('dimension').addEventListener('click',e=>{if(longTriggered){longTriggered=false;e.stopImmediatePropagation();}},true);
function setFullscreen(on){app.fullscreen=on;document.body.classList.toggle('fullscreen',on);queue();} $('fullClose').onclick=()=>setFullscreen(false);$('fullPlus').onclick=()=>{app.zoom=clamp(app.zoom*1.13,.5,4);queue();};$('fullMinus').onclick=()=>{app.zoom=clamp(app.zoom/1.13,.5,4);queue();};
stage.addEventListener('wheel',e=>{if(app.tab==='create'&&app.draft){e.preventDefault();app.zoom=clamp(app.zoom*(e.deltaY>0?.92:1.08),.5,4);queue();}},{passive:false});
$('draw').onclick=()=>{if(!app.draft)return;if(drawRaf)cancelAnimationFrame(drawRaf);let start=performance.now();function step(now){app.drawProgress=clamp((now-start)/8000,0,1);queue();if(app.drawProgress<1)drawRaf=requestAnimationFrame(step);else drawRaf=0;}drawRaf=requestAnimationFrame(step);};
let lastTime=0;function tick(now){if(app.autoRotate&&app.tab==='create'&&app.draft){if(lastTime)app.rotY+=(now-lastTime)*.00033;queue();}if(app.tab==='arrange'&&breeze.playing&&breeze.strength!=='still'&&stored.arrangement.length){if(!breeze.last||now-breeze.last>=38){const delta=breeze.last?Math.min(now-breeze.last,90):38;breeze.clock+=delta;breeze.last=now;queue();}}else breeze.last=0;lastTime=now;requestAnimationFrame(tick);}requestAnimationFrame(tick);
new ResizeObserver(()=>queue()).observe(stage);
function readLocalCache(){try{const data=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(data?.data){return {data:normalizeData(data.data),dirty:!!data.dirty};}const old=JSON.parse(localStorage.getItem('flowergraph-studio-v1')||'null');if(old?.library&&old?.arrangement){return {data:normalizeData(old),dirty:true};}}catch(e){console.warn('Could not read locally saved Flowergraph data',e);}return null;}
async function loadRemote(force=false){
 if(loadingRemote&&!force)return;
 loadingRemote=true;
 dataStatus='Loading '+DATA_FILE+'…';renderControls();
 try{
  const response=await fetch('./'+DATA_FILE+'?v='+Date.now(),{cache:'no-store'});
  if(!response.ok)throw Error('HTTP '+response.status);
  const remote=normalizeData(await response.json());
  const local=readLocalCache();
  if(!force&&local?.dirty&&JSON.stringify(local.data)!==JSON.stringify(remote)){
   stored=local.data;dirty=true;dataStatus='Local unpublished changes loaded; GitHub JSON available';
  }else{
   stored=remote;dirty=false;dataStatus='Loaded '+DATA_FILE+' from GitHub';cacheLocal();
  }
  resetDataSelection();thumbCache.clear();
 }catch(e){
  console.warn('GitHub JSON loading unavailable',e);
  const local=readLocalCache();if(local){stored=local.data;dirty=local.dirty;dataStatus=dirty?'Local unpublished changes loaded; GitHub JSON unavailable':'Local backup loaded; GitHub JSON unavailable';}
  else {stored=emptyData();dirty=false;dataStatus='No GitHub JSON loaded. Import JSON or host HTML and JSON together.';}
 }
 loadingRemote=false;renderControls();queue();
}
// Allow startup to read the relative JSON even when there is no local cache.
loadingRemote=false;
renderControls();queue();loadRemote();
