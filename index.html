<script>
const GENERATORS={};
GENERATORS["dahlia"] = (recipe) => {
 const state={seed:recipe.seed,style:recipe.style,geometry:[],recipe:null, colors:{},mode:'2d'};
 const TAU=Math.PI*2, GOLD=Math.PI*(3-Math.sqrt(5));

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const hash=(i,k=0)=>{let x=Math.sin(i*127.1+k*311.7+state.seed*7.71)*43758.5453;return x-Math.floor(x)};

function lerp(a,b,t){return a+(b-a)*t;}
function flowerRecipe(){
  const r=k=>hash(-1000,k);
  const count=Math.round(lerp(165,275,r(1))/5)*5;
  const layers=Math.max(7,Math.min(15,Math.round(lerp(8,14.5,r(2)))));
  const curlPct=lerp(36,68,r(3));
  const fullnessPct=lerp(82,124,r(4));
  const irregularPct=lerp(10,34,r(5));
  const lengthScale=lerp(.82,1.18,r(6));
  const widthScale=lerp(.82,1.18,r(7));
  const spreadScale=lerp(.92,1.10,r(8));
  const centerLift=lerp(.88,1.18,r(9));
  return {count,layers,curlPct,fullnessPct,irregularPct,lengthScale,widthScale,spreadScale,centerLift};
}
function buildPetals(){
  state.recipe=flowerRecipe();
  const petals=[];
  const {count:N,layers:L,curlPct,fullnessPct,irregularPct,lengthScale,widthScale,spreadScale,centerLift}=state.recipe;
  for(let i=0;i<N;i++){
    const t=(i+.5)/N;
    const ring=Math.min(L-1,Math.floor(t*L));
    const f=(ring+.5)/L;
    const angle=i*GOLD;
    const j=(hash(i,1)-.5)*irregularPct/100;
    const rad=(.045+Math.pow(f,.84)*.66)*spreadScale;
    const height=.32*(1-f)*(1-f)*centerLift;
    const length=(.12+.52*Math.pow(f,.83))*lengthScale*(fullnessPct/100)*(1+j*.8);
    const width=(.047+.13*Math.pow(f,.75))*widthScale*(1+j);
    const lift=(.24*(1-f)-.12*f)*(0.92+.18*centerLift);
    const curl=(curlPct/100)*(.10+.17*f);
    const twist=(hash(i,2)-.5)*irregularPct/100*.6;
    petals.push({ring,ringFrac:f,angle:angle+j,rad,height,length,width,lift,curl,twist,i,layers:L});
  }
  return petals;
}
function surf(p,u,w){
  const a=p.angle, radial=[Math.cos(a),Math.sin(a)], side=[-Math.sin(a),Math.cos(a)];
  const span=p.width*Math.pow(Math.sin(Math.PI*clamp(u,0,1)),.70)*(1-.3*u);
  const reach=p.rad+p.length*u;
  const twist=w*span+p.twist*u;
  const x=radial[0]*reach+side[0]*twist;
  const y=radial[1]*reach+side[1]*twist;
  const z=p.height+p.lift*u+p.curl*u*u+(.055+.065*(((state.recipe&&state.recipe.curlPct)||52)/100))*w*w*Math.sin(Math.PI*u)-p.curl*.55*Math.pow(u,4);
  return {x,y,z};
}
function pushLine(lines,points,width,alpha){ if(points.length>1) lines.push({points,width,alpha,color:'#df679a'}); }
function lineAtW(p,w,samples=22){ const pts=[]; for(let j=0;j<=samples;j++) pts.push(surf(p,j/samples,w)); return pts; }
function lineAtU(p,u,samples=12){ const pts=[]; for(let j=0;j<=samples;j++) pts.push(surf(p,u,-1+2*j/samples)); return pts; }
function styleFillForPetal(style,p){
  const outer=p.ringFrac;
  if(style==='simple'){
    const ws = outer>.72 ? [-.42,0,.42] : outer>.48 ? [0] : [];
    const us = outer>.72 ? [.32,.58,.82] : outer>.48 ? [.48] : [];
    return {ws,us,longAlpha:.16,crossAlpha:.12};
  }
  if(style==='rich'){
    const ws = outer>.82 ? [-.70,-.42,-.16,0,.16,.42,.70] : outer>.60 ? [-.46,-.12,.12,.46] : outer>.36 ? [-.18,.18] : [];
    const us = outer>.82 ? [.18,.30,.42,.54,.66,.78,.90] : outer>.60 ? [.28,.46,.64,.82] : outer>.36 ? [.52,.74] : [];
    return {ws,us,longAlpha:.23,crossAlpha:.17};
  }
  const ws = outer>.84 ? [-.78,-.56,-.34,-.12,.12,.34,.56,.78] : outer>.64 ? [-.54,-.30,-.08,.08,.30,.54] : outer>.42 ? [-.28,0,.28] : [];
  const us = outer>.84 ? [.16,.26,.36,.46,.56,.66,.76,.86,.94] : outer>.64 ? [.24,.38,.52,.66,.80,.92] : outer>.42 ? [.44,.62,.80] : [];
  return {ws,us,longAlpha:.25,crossAlpha:.19};
}
function build(){
  const petals=buildPetals(), lines=[];
  for(const p of petals){
    // Structural lines common to all styles.
    pushLine(lines,lineAtW(p,-1),1.00,.34);
    pushLine(lines,lineAtW(p,1),1.00,.34);
    pushLine(lines,lineAtW(p,0),.74,.16);
    pushLine(lines,lineAtU(p,.97,10),.52,.18);
    // Interior color-in lines only.
    const fill=styleFillForPetal(state.style,p);
    for(const w of fill.ws) pushLine(lines,lineAtW(p,w),.62,fill.longAlpha);
    for(const u of fill.us) pushLine(lines,lineAtU(p,u,10),.50,fill.crossAlpha);
  }
  state.geometry=lines;
}

 build();
 return state.geometry;
};
GENERATORS["iris"] = (recipe) => {
 const state={seed:recipe.seed,style:recipe.style,geometry:[],recipe:null, colors:{},mode:'2d'};
 const TAU=Math.PI*2;

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const add=(a,b)=>({x:a.x+b.x,y:a.y+b.y,z:a.z+b.z});
const mul=(a,k)=>({x:a.x*k,y:a.y*k,z:a.z*k});
const norm=v=>{const m=Math.hypot(v.x,v.y,v.z)||1;return mul(v,1/m)};
function rng(seed){let s=seed>>>0;return ()=>{s=(Math.imul(1664525,s)+1013904223)>>>0;return s/4294967296}}
function build(){
 const r=rng(state.seed),rand=(a,b)=>a+(b-a)*r(),style=state.style;
 const rich=style==='rich',wild=style==='wandering',simple=style==='simple';
 const lines=[];function line(points,color,width=1,alpha=1){if(points.length>1)lines.push({points,color,width,alpha})}
 const petalColors=['#ae85dc','#b697e6','#ccacec','#8f69c2','#a57cd0','#bd98df'];
 const lime='#d8b550',beard='#e5aa43',green='#6ea46e';
 const head={x:0,y:-.55,z:0};
 // Stem bends gently as it approaches the flower.
 const stemPts=[];for(let j=0;j<=38;j++){const t=j/38;stemPts.push({x:.08*Math.sin(2.8*t+.2)*t,y:1.75-2.30*t,z:.065*Math.sin(3*t+.6)*t})}line(stemPts,green,2.3,.90);
 function blade(base,az,length,width,bend){
   function point(t,v){const w=width*Math.sin(Math.PI*Math.pow(t,.86))*(.92+.08*t);
     const lean=bend*t*t;return{x:base.x+Math.cos(az)*lean + -Math.sin(az)*v*w,y:base.y-length*t+.14*Math.sin(Math.PI*t),z:base.z+Math.sin(az)*lean+Math.cos(az)*v*w};}
   for(const v of [-1,-.42,0,.42,1]){const pts=[];for(let i=0;i<=42;i++)pts.push(point(i/42,v));line(pts,green,v===0?1.1:.75,v===0?.85:.43)}
   for(let i=1;i<8;i++){const pts=[];for(let j=0;j<=10;j++)pts.push(point(i/8,-1+2*j/10));line(pts,green,.50,.23)}
 }
 // Sword-shaped foliage originates well below the blossom.
 for(let i=0;i<(simple?2:3);i++){
  const a=i*2.55+rand(-.18,.18),base={x:rand(-.06,.06),y:1.55+rand(-.10,.08),z:rand(-.06,.06)};
  // Leaf points up from its lower attachment, bends away from stem.
  function lp(t,v){const rad=.2*t+.42*t*t; const w=.13*Math.sin(Math.PI*Math.pow(t,.76));return{x:base.x+rad*Math.cos(a)-v*w*Math.sin(a),y:base.y-1.72*t+rad*.17,z:base.z+rad*Math.sin(a)+v*w*Math.cos(a)}}
  for(const v of [-1,0,1]){let pts=[];for(let j=0;j<=45;j++)pts.push(lp(j/45,v));line(pts,green,v===0?1.12:.84,v===0?.74:.54)}
 }
 // Three upright standards and three downward-arching falls.
 function petal(az,isFall,idx){
  const length=(isFall?1.13:.98)*rand(.91,1.10),maxWidth=(isFall?.34:.30)*rand(.90,1.11);
  const twist=rand(-.17,.17)*(wild?2.6:rich?1.4:.60);
  const phase=rand(0,6.283),flutter=wild?.105:rich?.055:.019;
  const roll=isFall?rand(.11,.22):rand(.09,.17);
  const color=petalColors[(idx+(isFall?3:0))%petalColors.length];
  function pos(u,v){
   const angle=az+twist*u*u;
   const outward=isFall?.13+1.02*Math.pow(u,1.22):.12+.33*u*u;
   const rise=isFall?(-.24*u+.72*u*u):(-1.00*u+.14*u*u);
   const widen=Math.pow(Math.sin(Math.PI*u),.76)*(1-.11*u);
   const w=maxWidth*widen;
   const edgeRuffle=flutter*Math.pow(u,2)*Math.pow(Math.abs(v),2.4)*Math.sin(9*Math.PI*u+phase+v*1.7);
   const cup=roll*(v*v)*Math.sin(Math.PI*u);
   const tipBend=.10*Math.pow(u,3);
   return {x:head.x+Math.cos(angle)*(outward*length+cup+edgeRuffle)+(-Math.sin(angle))*v*w,
       y:head.y+rise*length+tipBend+(isFall?.055:-.045)*(v*v)*Math.sin(Math.PI*u)+edgeRuffle*.38,
       z:head.z+Math.sin(angle)*(outward*length+cup+edgeRuffle)+Math.cos(angle)*v*w};
  }
  // Keep the ORIGINAL SIX PETALS and their surfaces unchanged.
  // Fill is created by sampling more curves ON each original petal, not by adding petals.
  const steps=64;
  const contourCount=simple?7:rich?48:108;
  for(let k=0;k<contourCount;k++){
   const v=contourCount===1?0:-1+2*k/(contourCount-1);
   const pts=[];for(let j=0;j<=steps;j++)pts.push(pos(j/steps,v));
   const edge=Math.abs(v)>.995,mid=Math.abs(v)<.008;
   line(pts,color,edge?1.45:mid?1.15:(simple?.67:rich?.86:.98),
      edge?.96:mid?.76:(simple?.46:rich?.52:.60));
  }
  // Close cross-hatching adds apparent color mass, without altering the petal silhouette.
  const crossN=simple?8:rich?30:68;
  for(let j=1;j<=crossN;j++){
   const u=j/(crossN+1),pts=[];

// Desktop: match the control's top edge and dock against the figure's right edge.

function positionInfoPopup(){
 const popup=$('infoPopup');
 if(popup.classList.contains('hidden'))return;
 const figure=stage.getBoundingClientRect();
 const control=infoAnchor && infoAnchor.isConnected ? infoAnchor.getBoundingClientRect() : $('infoToggle').getBoundingClientRect();
 const inset=12;
 const availableWidth=Math.max(160,figure.width-inset*2);
 popup.style.width=Math.min(405,availableWidth)+'px';
 popup.style.maxHeight=Math.max(100,Math.min(620,figure.height-inset*2,window.innerHeight-16))+'px';
 const pw=popup.getBoundingClientRect().width;
 const ph=popup.getBoundingClientRect().height;
 const minX=figure.left+inset;
 const maxX=Math.max(minX,figure.right-pw-inset);
 const minY=Math.max(8,figure.top+inset);
 const maxY=Math.max(minY,Math.min(window.innerHeight-ph-8,figure.bottom-ph-inset));
 const panel=document.querySelector('.panel').getBoundingClientRect();
 const stacked=panel.top>=figure.bottom-5;
 const overFigure=control.left<figure.right-3 && control.right>figure.left+3 && control.top<figure.bottom && control.bottom>figure.top;
 let x=maxX,y;
 if(overFigure){
  // Figure controls (Full, Draw, Rotate, 2D/3D) should not sit underneath their explanations.
  const center=figure.left+figure.width/2;
  x=control.left<center?control.right+inset:control.left-pw-inset;
  x=Math.max(minX,Math.min(maxX,x));
  y=control.top;
 }else if(stacked){
  // When the control panel is below the square figure there is no common
  // screen height; keep the explanation at the figure edge closest to the button.
  y=maxY;
 }else{
  y=control.top;
 }
 y=Math.max(minY,Math.min(maxY,y));
 popup.style.left=Math.round(x)+'px';
 popup.style.top=Math.round(y)+'px';
}

$('infoClose').onclick=()=>{$('infoPopup').classList.add('hidden');infoAnchor=null;};
$('infoToggle').onclick=()=>{
 infoMode=!infoMode;
 $('infoToggle').classList.toggle('active',infoMode);
 $('infoToggle').setAttribute('aria-pressed',String(infoMode));
 if(infoMode){infoAnchor=$('infoToggle');showInfo('Information','Click any button for guidance');}
 else {$('infoPopup').classList.add('hidden');infoAnchor=null;}
};
window.addEventListener('resize',positionInfoPopup);
document.querySelector('.panel-scroll').addEventListener('scroll',positionInfoPopup,{passive:true});
window.addEventListener('scroll',positionInfoPopup,{passive:true});
document.addEventListener('keydown',event=>{
 if(event.key==='Escape' && !$('infoPopup').classList.contains('hidden')){
  $('infoPopup').classList.add('hidden');event.preventDefault();
 }
});
function explainButton(b){
 infoAnchor=b;
 if(b.dataset.flower){showFlowerInfo(b.dataset.flower);return;}
 if(b.dataset.saved){showFlowerInfo(b.dataset.saved,true);return;}
 if(b.dataset.color){const part=b.dataset.color;showInfo(part[0].toUpperCase()+part.slice(1)+' Color','Choose a shade for the flower’s '+part+' lines. A new color affects the current draft, not saved designs until you select Save.');openColorPalette(part);return;}
 if(b.dataset.swatch){showControlInfo('swatch');return;}
 if(b.dataset.tab){showControlInfo(b.dataset.tab);tab(b.dataset.tab);return;}
 if(b.dataset.action){const a=b.dataset.action;
  if(a.startsWith('place:')){showControlInfo('place');return;}
  if(a.startsWith('edit:')){showControlInfo('edit');return;}
  if(a.startsWith('delLib:')){showControlInfo('delLib');return;}
  showControlInfo(a==='create'?'createAction':a);return;
 }
 if(CONTROL_GUIDE[b.id])showControlInfo(b.id);
}
// Capture all regular button clicks in guidance mode before their normal handlers.
document.addEventListener('click',event=>{
 if(!infoMode)return;
 const b=event.target.closest('button');
 if(!b || b.id==='infoToggle' || b.closest('#infoPopup') || b.closest('#modal'))return;
 event.preventDefault();event.stopImmediatePropagation();
 explainButton(b);
},true);

document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
const P=(e)=>{const r=canvas.getBoundingClientRect();return {x:clamp((e.clientX-r.left)/r.width,0,1),y:clamp((e.clientY-r.top)/r.height,0,1)};};let drag=null;
function hit(p){let list=[...stored.arrangement].sort((a,b)=>b.order-a.order);for(const a of list){let side=a.size,dx=(p.x-a.x)/(side*.55),dy=(p.y-a.y)/(side*.55);if(dx*dx+dy*dy<1.15)return a;}return null;}
function captureCanvasPointer(e){if(e.pointerId!=null&&canvas.setPointerCapture){try{canvas.setPointerCapture(e.pointerId);}catch(error){}}}
function canvasStart(e){
 if(infoMode){e.preventDefault();infoAnchor=canvas;showControlInfo('canvas');return;}
 if(app.tab!=='arrange'){
  if((app.tab==='create'||(app.tab==='library'&&app.libSelected))&&app.mode==='3d'){
   drag={camera:true,x:e.clientX,y:e.clientY};captureCanvasPointer(e);
  }
  return;
 }
 const p=P(e),item=hit(p);
 if(item){app.selected=item.id;drag={id:item.id,dx:p.x-item.x,dy:p.y-item.y};captureCanvasPointer(e);stage.classList.add('dragging');renderControls();queue();}
 else if(app.placing&&stored.library[app.placeType]){
  const recipe=copyRecipe(stored.library[app.placeType]),n=stored.arrangement.filter(i=>i.recipe.type===app.placeType).length;
  const angle=(n*2.399963229728653+Math.random()*.35)%(Math.PI*2);
  const item={id:(Date.now().toString(36)+Math.random().toString(36).slice(2,7)),recipe,x:p.x,y:p.y,size:.35,rx:-.28+.2*Math.sin(n*1.9),ry:angle,order:stored.arrangement.length?Math.max(...stored.arrangement.map(x=>x.order))+1:0};
  stored.arrangement.push(item);app.selected=item.id;save();renderControls();queue();
 }else{app.selected=null;renderControls();queue();}
 e.preventDefault();
}
function canvasMove(e){
 if(!drag)return;
 if(drag.camera){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;app.rotY+=dx*.009;app.rotX=clamp(app.rotX+dy*.009,-1.4,1.4);drag.x=e.clientX;drag.y=e.clientY;}
 else{const p=P(e),item=stored.arrangement.find(x=>x.id===drag.id);if(item){item.x=clamp(p.x-drag.dx,0,1);item.y=clamp(p.y-drag.dy,0,1);}}
 queue();e.preventDefault();
}
function endDrag(){if(drag&&!drag.camera)save();drag=null;stage.classList.remove('dragging');}
if(typeof window.PointerEvent==='function'){
 canvas.addEventListener('pointerdown',canvasStart);
 canvas.addEventListener('pointermove',canvasMove);
 canvas.addEventListener('pointerup',endDrag);
 canvas.addEventListener('pointercancel',endDrag);
 canvas.addEventListener('lostpointercapture',endDrag);
}else{
 // Pre-13.4 iPad Safari: use touch events (and mouse events for external mice).
 const asEvent=(touch,original)=>({clientX:touch.clientX,clientY:touch.clientY,preventDefault:()=>original.preventDefault()});
 canvas.addEventListener('touchstart',e=>{if(e.changedTouches.length===1){canvasStart(asEvent(e.changedTouches[0],e));e.preventDefault();}},{passive:false});
 canvas.addEventListener('touchmove',e=>{if(e.changedTouches.length&&drag){canvasMove(asEvent(e.changedTouches[0],e));}},{passive:false});
 canvas.addEventListener('touchend',endDrag,{passive:false});
 canvas.addEventListener('touchcancel',endDrag,{passive:false});
 canvas.addEventListener('mousedown',canvasStart);
 window.addEventListener('mousemove',canvasMove);
 window.addEventListener('mouseup',endDrag);
}
$('rotate').onclick=()=>{app.autoRotate=!app.autoRotate;if(app.autoRotate)app.mode='3d';$('rotate').classList.toggle('active',app.autoRotate);queue();};
$('dimension').onclick=()=>{app.mode=app.mode==='2d'?'3d':'2d';if(app.mode==='2d')app.autoRotate=false;$('rotate').classList.toggle('active',app.autoRotate);queue();};
$('full').onclick=()=>setFullscreen(true);
function setFullscreen(on){document.body.classList.toggle('fullscreen',on);queue();} $('fullClose').onclick=()=>setFullscreen(false);$('fullPlus').onclick=()=>{app.zoom=clamp(app.zoom*1.13,.5,4);queue();};$('fullMinus').onclick=()=>{app.zoom=clamp(app.zoom/1.13,.5,4);queue();};
stage.addEventListener('wheel',e=>{if(infoMode){e.preventDefault();infoAnchor=canvas;showControlInfo('canvas');return;}if(app.tab==='create'){e.preventDefault();app.zoom=clamp(app.zoom*(e.deltaY>0?.92:1.08),.5,4);queue();}},{passive:false});
$('draw').onclick=()=>{if(drawRaf)cancelAnimationFrame(drawRaf);let start=performance.now();function step(now){app.drawProgress=clamp((now-start)/8000,0,1);queue();if(app.drawProgress<1)drawRaf=requestAnimationFrame(step);else drawRaf=0;}drawRaf=requestAnimationFrame(step);};
// Cap animation frequency on older iPads without changing any saved flower geometry.
const frameInterval=tabletDevice?1000/24:1000/60;
let lastFrame=0;
function tick(now){
 if(document.hidden){lastFrame=now;requestAnimationFrame(tick);return;}
 if(now-lastFrame>=frameInterval){
  const delta=lastFrame?Math.min(now-lastFrame,90):frameInterval;
  if(app.autoRotate&&(app.tab==='create'||(app.tab==='library'&&app.libSelected))){app.rotY+=delta*.00033;queue();}
  if(app.tab==='arrange'&&breeze.playing&&stored.arrangement.length){breeze.clock+=delta;queue();}
  lastFrame=now;
 }
 requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
if(typeof ResizeObserver!=='undefined')new ResizeObserver(()=>queue()).observe(stage);
else window.addEventListener('resize',()=>queue());
renderControls();queue();

</script></body></html>
